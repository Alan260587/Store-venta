name: Deploy Sheló NABEL App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Reassemble Official 2026 Catalog PDF from binary parts
        run: |
          if [ ! -f public/assets/aistudio/Catalogo_Shelo_NABEL2026_fd41deed.pdf ] && [ -f public/assets/aistudio/Catalogo_Shelo_NABEL2026_part0.bin ]; then
            cat public/assets/aistudio/Catalogo_Shelo_NABEL2026_part0.bin \
                public/assets/aistudio/Catalogo_Shelo_NABEL2026_part1.bin \
                public/assets/aistudio/Catalogo_Shelo_NABEL2026_part2.bin \
                public/assets/aistudio/Catalogo_Shelo_NABEL2026_part3.bin \
                public/assets/aistudio/Catalogo_Shelo_NABEL2026_part4.bin \
                public/assets/aistudio/Catalogo_Shelo_NABEL2026_part5.bin \
                > public/assets/aistudio/Catalogo_Shelo_NABEL2026_fd41deed.pdf
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Copy SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
